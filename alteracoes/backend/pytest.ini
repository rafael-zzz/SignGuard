[pytest]
pythonpath = .
addopts = -m "not dependency_davi"

markers =
    dependency_rafael: requisito de integração cuja implementação pertence a backend/agents/ (executar separadamente com -m dependency_rafael)
    dependency_davi: requisito de integração cuja implementação pertence ao adaptador/contratos de Davi (executar separadamente com -m dependency_davi)
