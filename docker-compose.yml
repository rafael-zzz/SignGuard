services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /database/signguard.db
    volumes:
      - database:/database
    expose:
      - "8000"

  frontend:
    build: ./web
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  database: